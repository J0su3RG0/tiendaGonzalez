<!-- Se añade el formulario de Login requerido por la actividad 1 de Desarrollo de Aplicaciones en Red-->
<!-- Simula un formulario de inicio de sesión -->
<!-- Por defecto las credenciales de usuario: administrador y contraseña: administrador-->

<main>
  <!-- Pagina de Login -->
  <section class="container pb-3">
    <div class="row mt-5 gap-4 gap-md-0">
      <!-- Pagina de Login -->
      <div class="col-md-6">
        <h3>Formulario</h3>
        <form class="fs-5" id="login-form">
          <div class="mb-3">
            <!-- Se añade un label para el campo de usuario con el atributo for que hace referencia al id del input correspondiente -->
            <label for="login-username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="login-username" placeholder="Nombre Usuario" required>
          </div>
          <div class="mb-3">
            <label for="login-password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="login-password" placeholder="Su contraseña" required>
          </div>
          <!-- Para el ejemplo se utilizan las credenciales de usuari: administrador y contraseña: administrador-->
          <button type="submit" class="btn btn-secondary fs-5">Login</button>
          <p id="login-message" class="mt-3" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</main>
